name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for git rev-list --count

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute version
        id: ver
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHORT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d)
          echo "tag=v0.0.${COUNT}+${SHORT}" >> "$GITHUB_OUTPUT"
          echo "name=Build ${COUNT} (${DATE})" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.keystore/release.jks"

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$HOME/.keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/app-release.apk)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp "${{ steps.apk.outputs.path }}" \
             "MediaRelayBridge-${{ steps.ver.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body: |
            Auto-built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            See the [commit log](https://github.com/${{ github.repository }}/commits/${{ github.sha }}) for changes.
          files: MediaRelayBridge-${{ steps.ver.outputs.tag }}.apk
          fail_on_unmatched_files: true
